name: suyasuya
x-common: &common
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-suyasuya}
  DB_SSLMODE: disable
  REDIS_ADDR: redis:6379
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
  GCS_BUCKET: ${GCS_BUCKET:-}
  GCS_SIGNER_SERVICE_ACCOUNT: ${GCS_SIGNER_SERVICE_ACCOUNT:-}
  GCS_SIGNED_URL_TTL_SECONDS: ${GCS_SIGNED_URL_TTL_SECONDS:-900}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
  GOOGLE_APPLICATION_CREDENTIALS: /run/gcp/credentials.json
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-suyasuya}
      POSTGRES_USER: ${POSTGRES_USER:-suyasuya_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DB_CONTROL_USER: ${DB_CONTROL_USER:-suyasuya_control}
      DB_CONTROL_PASSWORD: ${DB_CONTROL_PASSWORD:?set DB_CONTROL_PASSWORD}
      DB_AGENT_USER: ${DB_AGENT_USER:-suyasuya_agent}
      DB_AGENT_PASSWORD: ${DB_AGENT_PASSWORD:?set DB_AGENT_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./docker/20-roles.sh:/docker-entrypoint-initdb.d/20-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    restart: unless-stopped
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  control:
    build:
      context: .
      dockerfile: docker/control.Dockerfile
    image: suyasuya-control:local
    restart: unless-stopped
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports: ['127.0.0.1:${APP_PORT:-8080}:8080']
    environment:
      <<: *common
      DB_CONTROL_USER: ${DB_CONTROL_USER:-suyasuya_control}
      DB_CONTROL_PASSWORD: ${DB_CONTROL_PASSWORD:?set DB_CONTROL_PASSWORD}
      APP_USERNAME: ${APP_USERNAME:-nemuilemon}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
      APP_SECURE_COOKIE: ${APP_SECURE_COOKIE:-false}
    volumes:
      - type: bind
        source: ${GCP_CREDENTIALS_FILE:?set GCP_CREDENTIALS_FILE}
        target: /run/gcp/credentials.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    image: suyasuya-agent:local
    restart: unless-stopped
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      <<: *common
      DB_AGENT_USER: ${DB_AGENT_USER:-suyasuya_agent}
      DB_AGENT_PASSWORD: ${DB_AGENT_PASSWORD:?set DB_AGENT_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
    volumes:
      - type: bind
        source: ${GCP_CREDENTIALS_FILE:?set GCP_CREDENTIALS_FILE}
        target: /run/gcp/credentials.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      control: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
