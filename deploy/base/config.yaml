apiVersion: v1
kind: ConfigMap
metadata:
  name: suyasuya-config
data:
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_NAME: suyasuya
  DB_SSLMODE: disable
  DB_CONTROL_USER: suyasuya_control
  DB_AGENT_USER: suyasuya_agent
  REDIS_ADDR: redis:6379
  GEMINI_MODEL: gemini-3.8-flash
  GCS_BUCKET: replace-me-bucket
  GCS_SIGNER_SERVICE_ACCOUNT: replace-me-signer@example-project.iam.gserviceaccount.com
  GCS_SIGNED_URL_TTL_SECONDS: '900'
  UPLOAD_MAX_BYTES: '10485760'
  APP_USERNAME: replace-me-user
  APP_SECURE_COOKIE: 'true'
