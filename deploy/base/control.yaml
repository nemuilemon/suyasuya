apiVersion: apps/v1
kind: Deployment
metadata:
  name: control
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: control
  template:
    metadata:
      labels:
        app: control
        app.kubernetes.io/part-of: suyasuya
    spec:
      serviceAccountName: control
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: wait-for-postgres
        image: postgres:16-alpine
        command:
        - sh
        - -ec
        - until pg_isready -h postgres -p 5432 -U suyasuya_control; do sleep 2; done
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: control
        image: suyasuya-control
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: suyasuya-config
        env:
        - name: DB_CONTROL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: control-secrets
              key: DB_CONTROL_PASSWORD
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: control-secrets
              key: APP_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 2
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: control
spec:
  type: ClusterIP
  selector:
    app: control
  ports:
  - name: http
    port: 80
    targetPort: http
