apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- cloudflared.yaml
images:
- name: suyasuya-control
  newName: asia-northeast1-docker.pkg.dev/suyasuya-prod/suyasuya/control
  newTag: deploy-20261004-1
- name: suyasuya-agent
  newName: asia-northeast1-docker.pkg.dev/suyasuya-prod/suyasuya/agent
  newTag: deploy-20261004-1
- name: suyasuya-postgres
  newName: asia-northeast1-docker.pkg.dev/suyasuya-prod/suyasuya/postgres
  newTag: deploy-20260930-1
replicas:
- name: control
  count: 1
- name: agent
  count: 1
patches:
- path: settings.yaml
namespace: suyasuya
