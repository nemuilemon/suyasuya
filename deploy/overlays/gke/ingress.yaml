apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: control
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: suyasuya-ip
    networking.gke.io/managed-certificates: control
    networking.gke.io/v1beta1.FrontendConfig: control
spec:
  rules:
  - host: sleep.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: control
            port:
              number: 80
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: control
spec:
  domains:
  - sleep.example.com
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: control
spec:
  redirectToHttps:
    enabled: true
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: control
spec:
  timeoutSec: 60
  healthCheck:
    type: HTTP
    port: 8080
    requestPath: /healthz
    checkIntervalSec: 10
    timeoutSec: 5
