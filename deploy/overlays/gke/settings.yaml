apiVersion: v1
kind: ConfigMap
metadata:
  name: suyasuya-config
data:
  GCS_BUCKET: replace-me-bucket
  GCS_SIGNER_SERVICE_ACCOUNT: suyasuya-control@example-project.iam.gserviceaccount.com
  APP_USERNAME: replace-me-user
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control
  annotations:
    iam.gke.io/gcp-service-account: suyasuya-control@example-project.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  annotations:
    iam.gke.io/gcp-service-account: suyasuya-agent@example-project.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: standard-rwo
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: standard-rwo
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: control
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
    cloud.google.com/backend-config: '{"default":"control"}'
