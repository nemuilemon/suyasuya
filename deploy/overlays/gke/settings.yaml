apiVersion: v1
kind: ConfigMap
metadata:
  name: suyasuya-config
data:
  GCS_BUCKET: suyasuya-sleep-images
  GCS_SIGNER_SERVICE_ACCOUNT: suyasuya-control@suyasuya-prod.iam.gserviceaccount.com
  APP_USERNAME: nemuilemon
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control
  annotations:
    iam.gke.io/gcp-service-account: suyasuya-control@suyasuya-prod.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  annotations:
    iam.gke.io/gcp-service-account: suyasuya-agent@suyasuya-prod.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: standard-rwo
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: standard-rwo
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
