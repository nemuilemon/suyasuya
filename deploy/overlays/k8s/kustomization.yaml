apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
images:
- name: suyasuya-control
  newName: registry.example.com/suyasuya/control
  newTag: replace-me-tag
- name: suyasuya-agent
  newName: registry.example.com/suyasuya/agent
  newTag: replace-me-tag
- name: suyasuya-postgres
  newName: registry.example.com/suyasuya/postgres
  newTag: replace-me-tag
replicas:
- name: control
  count: 0
- name: agent
  count: 0
patches:
- path: settings.yaml
namespace: suyasuya
