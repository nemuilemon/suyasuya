<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>suyasuya</title
  ><link rel="stylesheet" href="/style.css" />
  <script type="module" src="/app.js"></script>
  <body>
    <header>
      <a href="/" class="brand">☾ suyasuya</a><span>睡眠サポートagent</span
      ><button id="logout" hidden>ログアウト</button>
    </header>
    <main>
      <p id="notice" role="status"></p>
      <p id="session-loading" role="status">読み込み中…</p>
      <button id="retry-session" hidden>再読み込み</button>
      <section id="login" class="card narrow" hidden>
        <h1>ログイン</h1>
        <form id="login-form">
          <label
            >ユーザー名<input
              name="username"
              autocomplete="username"
              required /></label
          ><label
            >パスワード<input
              name="password"
              type="password"
              autocomplete="current-password"
              required /></label
          ><button>ログイン</button>
        </form>
      </section>
      <div id="app" hidden>
        <nav>
          <button data-page="record">記録する</button
          ><button data-page="records">一覧</button
          ><button data-page="analytics">ふりかえり</button
          ><button data-page="pvt">PVT</button
          ><button data-page="agent">agent ログ</button
          ><button data-page="settings">設定</button>
        </nav>
        <div id="content"></div>
      </div>
    </main>
    <dialog id="editor">
      <div class="dialog-header">
        <button id="close-editor" type="button" class="quiet">← 戻る</button>
      </div>
      <div id="editor-content"></div>
      <div class="dialog-footer">
        <button id="back-editor" type="button" class="quiet">戻る</button>
      </div>
    </dialog>
  </body>
</html>
